<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Family Trip 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one page per day — a date strip (bottom on phones, top on desktop) switches days;
   each day holds everything for that day: where we sleep, how we move, what we do, notes.
   Warm paper palette, quiet hairlines, Chinese-first type at a calm size. */
:root{
  color-scheme: light;
  --paper:#f7f4ef; --panel:#fffdf9; --beige:#efe8dd;
  --ink:#27231f; --ink-2:#534c45; --ink-3:#7f776d; --line:#e0d8cc;
  --green:#4f6444; --green-bg:#e7ece0;
  --brick:#9a3f2e; --brick-bg:#f5e4dd;
  --brown:#7a5f45;
  --f-head:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:8px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
@media (min-width:821px){body{padding-bottom:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
a{color:inherit}
h1,h2,h3{font-family:var(--f-head);font-weight:700;margin:0;text-wrap:balance;line-height:1.35}
p{margin:0}
:focus-visible{outline:2px solid var(--brick);outline-offset:3px}
.wrap{max-width:860px;margin:0 auto;padding-inline:clamp(16px,4vw,32px)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.top .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--f-head);font-size:18px;font-weight:700;text-decoration:none;white-space:nowrap}
.brand small{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--ink-3);margin-left:8px}
.jump{display:flex;gap:6px}
.jump a{font-size:14px;text-decoration:none;padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--ink-2);background:var(--panel);white-space:nowrap}
.jump a[aria-current="page"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.top .bar .jump{margin-left:auto}
.drive-pill{font-size:14px;font-weight:700;text-decoration:none;padding:6px 12px;border:1px solid var(--brick);border-radius:999px;color:var(--brick);background:var(--brick-bg);white-space:nowrap}

/* ---------- Day strip ---------- */
.strip{display:flex;gap:6px;overflow-x:auto;padding:8px clamp(16px,4vw,32px) 10px;scrollbar-width:none;max-width:860px;margin:0 auto}
.strip::-webkit-scrollbar{display:none}
.strip a{flex:0 0 auto;min-width:56px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:var(--r);text-decoration:none;background:var(--panel);font-size:12px;color:var(--ink-3);line-height:1.25;padding:4px 8px}
.strip a b{font-size:17px;color:var(--ink);font-weight:700}
.strip a .c{font-size:11px}
.strip a.g{border-color:var(--brick)} .strip a.g b{color:var(--brick)}
.strip a.today{box-shadow:inset 0 -3px 0 var(--green)}
.strip a[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:#d9d1c5}
.strip a[aria-current="page"] b{color:var(--paper)}
.strip .sep{flex:0 0 1px;background:var(--line);margin:6px 2px}
@media (max-width:820px){
  .strip{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 10px rgba(39,35,31,.06);max-width:none}
  .jump{display:none}
}

/* ---------- Page ---------- */
.page{padding-block:24px 56px;animation:in .3s ease-out}
@keyframes in{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.dhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:end;padding-bottom:16px;border-bottom:1px solid var(--ink);margin-bottom:20px}
.dhead .n{font-size:13px;font-weight:700;color:var(--brown);letter-spacing:.12em}
.dhead h1{font-size:clamp(26px,4.5vw,32px);margin-top:2px}
.dhead .w{font-size:15px;color:var(--ink-2);margin-top:2px}
.dhead .city{font-family:var(--f-head);font-size:15px;color:var(--ink-2);text-align:right;white-space:nowrap}
.dhead .city b{display:block;font-size:22px;color:var(--ink)}
.theme{font-size:18px;font-weight:700;margin-bottom:18px}
.theme.g{color:var(--brick)}

.sec-t{font-size:13px;font-weight:700;color:var(--ink-3);letter-spacing:.1em;margin:24px 0 10px;display:flex;align-items:center;gap:8px}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line)}

.info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.info{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.card .k{font-size:13px;color:var(--ink-3);font-weight:500}
.card .t{font-size:17px;font-weight:700;margin-top:2px}
.card .d{font-size:15px;color:var(--ink-2);margin-top:4px}
.card .row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
.card .big{font-size:18px;font-weight:700}
.card .arrow{color:var(--ink-3)}
.card.move{border-left:3px solid var(--green)}
.card.sleep{border-left:3px solid var(--brown)}
.card.sleep.none{border-left-color:var(--line)}
a.card.drive{display:block;text-decoration:none;border-left:3px solid var(--brick)}
a.card.drive .t{color:var(--brick)}

.st{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap;vertical-align:2px;margin-left:4px}
.st.ok{background:var(--green-bg);color:var(--green)}
.st.wait{background:var(--brick-bg);color:var(--brick)}
.st.tbd{background:var(--beige);color:var(--ink-2)}

.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:76px;top:8px;bottom:8px;width:1px;background:var(--line)}
.tl li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:24px;padding-block:10px;position:relative}
.tl li::before{content:"";position:absolute;left:72px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink-3)}
.tl li.m::before{background:var(--green);border-color:var(--green)}
.tl li.g::before{background:var(--brick);border-color:var(--brick)}
.tl .tm{font-size:16px;font-weight:700;text-align:right;line-height:1.4}
.tl .tm small{display:block;font-size:12px;font-weight:400;color:var(--ink-3)}
.tl .wh{font-size:16px;font-weight:700}
.tl .ds{font-size:15px;color:var(--ink-2)}
.maps{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:14px;font-weight:500;color:var(--green);text-decoration:none;border:1px solid color-mix(in srgb,var(--green) 45%,transparent);border-radius:999px;padding:4px 12px;min-height:34px}
.maps:hover{background:var(--green);color:#fff}

.note{background:var(--beige);border-radius:var(--r);padding:12px 16px;font-size:15px;color:var(--ink-2)}
.note + .note{margin-top:8px}
ul.notes{margin:0;padding:12px 16px 12px 34px}
ul.notes li + li{margin-top:4px}
.note b{color:var(--ink)}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:32px}
.pager a{flex:1;text-decoration:none;border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;background:var(--panel);min-height:52px}
.pager a small{display:block;font-size:12px;color:var(--ink-3)}
.pager a b{font-size:15px}
.pager a.nx{text-align:right}
.pager a:hover{border-color:var(--ink)}

/* ---------- Overview ---------- */
.hero{margin-bottom:8px;padding-block:8px 4px}
.hero .eb{font-size:13px;color:var(--brown);letter-spacing:.14em}
.hero h1{font-size:clamp(36px,7vw,52px);margin:4px 0 8px}
.hero .dt{font-size:18px;font-weight:700}
.hero .sb{color:var(--ink-2)}
.hero .cd{margin-top:12px}
.hero .cd b{font-size:26px;color:var(--brick);margin-inline:4px}
.cover{aspect-ratio:4/3;border-radius:var(--r);background:#aea79d;position:relative;overflow:hidden;max-width:100%}
.cover .sun{position:absolute;width:32%;aspect-ratio:1;border-radius:50%;background:rgba(247,244,239,.6);left:16%;top:18%}
.cover .hill{position:absolute;left:-10%;right:-10%;bottom:-12%;height:44%;background:rgba(79,100,68,.4);border-radius:50% 50% 0 0}
.cover .vt{position:absolute;right:16px;top:16px;writing-mode:vertical-rl;color:#fff;font-family:var(--f-head);letter-spacing:.3em}
@media (max-width:720px){.hero{grid-template-columns:1fr}.cover{order:-1;aspect-ratio:16/8}}
.days{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.days a{display:grid;grid-template-columns:88px 100px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.days a:hover{background:var(--panel)}
.days .d{font-weight:700;white-space:nowrap} .days .d small{font-weight:400;color:var(--ink-3);margin-left:4px}
.days .c{font-size:14px;color:var(--brown)}
.days .t{font-size:15px}
.days .go{color:var(--ink-3)}
.days a.g .t{color:var(--brick);font-weight:700}
.days a.today{background:var(--green-bg)}
.days a{border-left:4px solid transparent}
.days a.r-ny{border-left-color:#c5cdd8}.days a.r-dc{border-left-color:#b7c6ab}.days a.r-la{border-left-color:#dfc3ab}.days a.g{border-left-color:var(--brick)}
@media (max-width:560px){.days a{grid-template-columns:86px minmax(0,1fr) auto;row-gap:0}.days .c{grid-column:2;grid-row:2;font-size:13px}.days .t{grid-column:2;grid-row:1}.days .wxs{grid-row:1/3;grid-column:3}.days .d{grid-row:1/3}}

/* ---------- Checklists ---------- */
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.list li{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.list .mk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink-3);margin-top:3px}
.list li.done .mk{background:var(--green);border-color:var(--green)}
.list .t{font-weight:700}
.list .s{font-size:15px;color:var(--ink-2)}
.list .who{font-size:13px;color:var(--brown);font-weight:700}
footer{text-align:center;color:var(--ink-3);font-size:13px;padding-block:8px 32px}
.wx{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;margin-bottom:6px}
.wx .temp{font-size:26px;font-weight:700;line-height:1.1;white-space:nowrap}
.wx .temp small{font-size:15px;font-weight:500;color:var(--ink-3);margin-left:4px}
.wx .desc{font-size:16px;font-weight:700}
.wx .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.wx .tg{font-size:13px;padding:1px 10px;border-radius:999px;background:var(--beige);color:var(--ink-2)}
.wx .tg.rain{background:#e3e8ee;color:#3f5570}
.wx .tg.snow{background:#eef0f4;color:#4a4f6a;border:1px solid #c9ceda}
.wx .src{grid-column:1/-1;font-size:12px;color:var(--ink-3);border-top:1px dashed var(--line);padding-top:6px;margin-top:4px}
.wx.fc{border-left:3px solid #6b7f95}
.days .wxs{font-size:13px;color:var(--ink-3);white-space:nowrap}
.strip a.c-ny{background:#e4e8ee;border-color:#c5cdd8}
.strip a.c-dc{background:#e2eadc;border-color:#b7c6ab}
.strip a.c-la{background:#f3e3d6;border-color:#dfc3ab}
.strip a.c-ny.g,.strip a.c-dc.g{background:var(--brick-bg);border-color:var(--brick)}
.strip a[aria-current="page"]{background:var(--ink)!important;border-color:var(--ink)!important}
.cl{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin:4px 0 14px}
.cl span{display:inline-flex;align-items:center;gap:6px}
.cl i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
.dhead .city b.c-ny,.days .c.c-ny{color:#48607d}
.dhead .city b.c-dc,.days .c.c-dc{color:#4f6444}
.dhead .city b.c-la,.days .c.c-la{color:#a2573a}
.strip a.g,.strip a.c-dc.g{background:#e2eadc;border-color:#b7c6ab}
.strip a.g b{color:var(--ink)}
.strip a.g[aria-current="page"] b{color:var(--paper)}
.theme.g{color:var(--ink)}
.days a.g .t{color:var(--ink);font-weight:400}
.days a.g{border-left-color:#b7c6ab}
.tl li.g::before{background:var(--paper);border-color:var(--ink-3)}
.pie-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.pie-wrap svg{flex:0 0 auto;max-width:100%}
.leg{list-style:none;margin:0;padding:0;display:grid;gap:6px;flex:1;min-width:220px}
.leg li{display:grid;grid-template-columns:14px minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:15px}
.leg i{width:12px;height:12px;border-radius:3px}
.leg .p{font-weight:700;text-align:right}
.leg .v{color:var(--ink-3);text-align:right;white-space:nowrap;font-size:14px}
.btbl{width:100%;border-collapse:collapse;font-size:15px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.btbl th,.btbl td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.btbl .r{text-align:right;white-space:nowrap}
.btbl tr.cat td{background:var(--beige);font-weight:700;font-size:14px;color:var(--ink-2)}
.btbl tr.sub td{font-weight:700;border-bottom:2px solid var(--line)}
.btbl tr.tot td{font-weight:700;font-size:17px;background:var(--panel);border-top:2px solid var(--ink)}
.btbl .d{font-size:13px;color:var(--ink-3)}
.tblwrap{overflow-x:auto}
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi .card .big{font-size:22px}
@media (max-width:620px){.kpi{grid-template-columns:1fr}}
.bl{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.bcat{background:var(--beige);font-weight:700;font-size:14px;color:var(--ink-2);padding:8px 14px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.brow .bt{font-weight:700}
.brow .d{font-size:13px;color:var(--ink-3)}
.brow .ba{text-align:right;white-space:nowrap}
.brow .tw{font-weight:700}
.brow.sub{font-weight:700;background:#faf7f2}
.brow.tot{font-size:17px;font-weight:700;border-top:2px solid var(--ink);border-bottom:none}
.wxl{display:flex;align-items:center;gap:10px}
.wxi{flex:0 0 auto}
.wxi-sun{color:#b98a2f}.wxi-part{color:#8a7a5a}.wxi-cloud{color:#7f776d}.wxi-rain{color:#4f6b8a}.wxi-snow{color:#5d7894}
.days .wxs{display:inline-flex;align-items:center;gap:4px}
@media (max-width:560px){.wx{grid-template-columns:1fr}.wx .src{grid-column:1}}
</style>
</head>

async function loadLive(){
  var now=new Date(),stamp=(now.getMonth()+1)+'/'+now.getDate()+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),got={};
  await Promise.all(Object.keys(LOC).map(async function(k){
    var L=LOC[k];
    var url='https://api.open-meteo.com/v1/forecast?latitude='+L.lat+'&longitude='+L.lon+'&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,snowfall_sum&timezone='+encodeURIComponent(L.tz)+'&forecast_days=16';
    try{
      var r=await fetch(url); if(!r.ok)return; var j=await r.json(), d=j.daily; if(!d||!d.time)return;
      d.time.forEach(function(t,i){
        var m=/^2026-12-(\d\d)$/.exec(t); if(!m)return; var id='d'+(+m[1]); if(WXCITY[id]!==k)return;
        if(d.temperature_2m_max[i]==null)return;
        var w={hi:Math.round(d.temperature_2m_max[i]),lo:Math.round(d.temperature_2m_min[i]),rain:Math.round(d.precipitation_probability_max[i]||0)};
        w.snow=(d.snowfall_sum[i]||0)>0?w.rain:0; w.desc=wxDesc(w); w.city=L.city; w.updated=stamp; got[id]=w;
      });
    }catch(e){}
  }));
  if(Object.keys(got).length){LIVE=got;var y=window.scrollY;render(true);window.scrollTo(0,y);}
}

  h+='<div class="sec-t">明細</div><div class="bl">';
  BUD.forEach(function(g){h+='<div class="bcat">'+g.cat+'</div>';
    g.rows.forEach(function(r){var st=r[2]==='est'?'tbd':r[2];h+='<div class="brow"><div class="bn"><div class="bt">'+r[0]+'<span class="st '+st+'">'+r[3]+'</span></div><div class="d">'+r[1]+'</div></div><div class="ba"><div class="tw num">'+(r[5]===r[6]?fmt(r[5]):fmt(r[5])+'–'+fmt(r[6]))+'</div><div class="d num">'+r[4]+'</div></div></div>';});
    h+='<div class="brow sub"><div class="bn">'+g.cat+'小計</div><div class="ba"><div class="tw num">'+(g.lo===g.hi?fmt(g.lo):fmt(g.lo)+'–'+fmt(g.hi))+'</div></div></div>';});
  h+='<div class="brow tot"><div class="bn">總預算（新台幣）</div><div class="ba"><div class="tw num">'+fmt(lo)+'–'+fmt(hi)+'</div></div></div></div>';
  h+='<p class="note" style="margin-top:12px">國內線是媽媽、Judy 和小朋友 3 人；Joe 不去洛杉磯。</p>';
  return h;
}
function esc(s){return s;}
function stripHTML(){
  var h='<a href="#overview" data-p="overview"><b>總覽</b><span class="c">全部</span></a><a href="#prep" data-p="prep"><b>準備</b><span class="c">行前</span></a><a href="#todo" data-p="todo"><b>待確認</b><span class="c">事項</span></a><a href="#budget" data-p="budget"><b>預算</b><span class="c">費用</span></a><span class="sep"></span>';
  DAYS.forEach(function(d){h+='<a href="#'+d.id+'" data-p="'+d.id+'" data-day="'+d.day+'" class="c-'+WXCITY[d.id]+(d.g?' g':'')+'"><b>'+d.day+'</b><span class="c">'+(d.g?'典禮':'週'+d.wk)+'</span></a>';});
  return h;
}
function card(o,cls){
  var h='<div class="card '+cls+(o.none?' none':'')+'"><div class="k">'+o.k+'</div><div class="t">'+o.t+(o.s?'<span class="st '+o.s+'">'+o.sl+'</span>':'')+'</div>';
  if(o.from)h+='<div class="row"><span class="big num">'+o.from+'</span><span class="arrow">→</span><span class="big num">'+o.to+'</span></div>';
  if(o.d)h+='<div class="d">'+o.d+'</div>';
  if(o.m)h+='<a class="maps" href="'+M(o.m)+'" target="_blank" rel="noopener">開啟地圖 ›</a>';
  return h+'</div>';
}
function dayHTML(i){
  var d=DAYS[i],h='';
  h+='<div class="dhead"><div><div class="n">DAY '+String(d.n).padStart(2,'0')+'</div><h1>'+d.date+'</h1><div class="w">'+d.w+'</div></div><div class="city"><b class="c-'+WXCITY[d.id]+'">'+d.city+'</b></div></div>';
  h+='<p class="theme'+(d.g?' g':'')+'">'+d.theme+'</p>';
  if(d.notes)h+='<div class="sec-t">提醒</div><ul class="note notes">'+d.notes.map(function(n){return '<li>'+n+'</li>';}).join('')+'</ul>';
  h+='<div class="sec-t">今天天氣</div>'+wxHTML(d.id);
  h+='<div class="sec-t">今天的交通與住宿</div><div class="info">';
  (d.move||[]).forEach(function(m){var o=Object.assign({k:'交通'},m);h+=card(o,'move');});
  if(!d.move)h+=card({k:'交通',t:'市區移動',d:d.stay==='la'?'自己開租車':'地鐵、走路或叫車'},'move');
  h+=card(STAY[d.stay],'sleep');
  h+='</div>';
  h+='<div class="sec-t">今天要做的事</div><ul class="tl">';
  d.acts.forEach(function(a){
    h+='<li class="'+(a[5]||'')+'"><div class="tm num">'+a[0]+(a[1]?'<small>'+a[1]+'</small>':'')+'</div><div><div class="wh">'+a[2]+'</div>'+(a[3]?'<div class="ds">'+a[3]+'</div>':'')+(a[4]?'<a class="maps" href="'+M(a[4])+'" target="_blank" rel="noopener">開啟地圖 ›</a>':'')+'</div></li>';
  });
  h+='</ul>';
  var p=DAYS[i-1],n=DAYS[i+1];
  h+='<div class="pager">'+(p?'<a href="#'+p.id+'"><small>← 前一天</small><b>'+p.date+'</b></a>':'<a href="#overview"><small>← 回到</small><b>總覽</b></a>')+(n?'<a class="nx" href="#'+n.id+'"><small>下一天 →</small><b>'+n.date+'</b></a>':'<a class="nx" href="#overview"><small>回到 →</small><b>總覽</b></a>')+'</div>';
  return h;
}
function overviewHTML(){
  var h='<div class="hero"><div><div class="eb">旅の記録 · 我們的家族旅行</div><h1>Family Trip 2026</h1><p class="dt num">2026 年 12 月 11 日 — 12 月 23 日</p><p class="sb">紐約 → 華盛頓（畢業典禮）→ 洛杉磯，共 12 晚</p><p class="cd" id="cd"></p></div></div>';
  h+='<div class="sec-t">每一天（點進去看當天完整行程）</div><div class="cl"><span><i style="background:#e4e8ee"></i>紐約</span><span><i style="background:#e2eadc"></i>華盛頓</span><span><i style="background:#f3e3d6"></i>洛杉磯</span></div><ul class="days">';
  DAYS.forEach(function(d){h+='<li><a href="#'+d.id+'" data-day="'+d.day+'" class="r-'+WXCITY[d.id]+(d.g?' g':'')+'"><span class="d num">12/'+d.day+'<small>週'+d.wk+'</small></span><span class="c c-'+WXCITY[d.id]+'">'+d.city+'</span><span class="t">'+d.theme+'</span><span class="wxs num">'+wxShort(d.id)+'</span></a></li>';});
  h+='</ul>';
  h+='<div class="sec-t">其他</div><div class="info">'+card({k:'出發前',t:'行前準備',d:'ESTA、國際駕照、保暖衣物'},'sleep')+card({k:'還沒完成',t:'待確認事項',d:'機票、飯店、租車、訂位'},'move')+'</div><div style="margin-top:12px">'+driveHTML()+'</div>';
  return h.replace('行前準備</div>','<a href="#prep" style="text-decoration:none">行前準備 ›</a></div>').replace('待確認事項</div>','<a href="#todo" style="text-decoration:none">待確認事項 ›</a></div>');
}
function listHTML(title,sub,items,todo){
  var h='<div class="dhead"><div><div class="n">'+(todo?'TO CONFIRM':'BEFORE WE GO')+'</div><h1>'+title+'</h1><div class="w">'+sub+'</div></div></div><ul class="list">';
  items.forEach(function(it){h+='<li class="'+(it[3]||'')+'"><span class="mk"></span><div>'+(it[2]?'<div class="who">負責：'+it[2]+'</div>':'')+'<div class="t">'+it[0]+'</div><div class="s">'+it[1]+'</div></div></li>';});
  return h+'</ul>';
}
var PEOPLE=['Judy','Joe','Miffy'];
function todoHTML(){
  var h=listHTML('待確認事項','還沒訂、還沒確定的事，照負責的人分',[],1).replace('<ul class="list"></ul>','')+'<div style="margin-bottom:4px">'+driveHTML()+'</div>';
  function items(a){return a.map(function(it){return [it[0],it[1],'',it[3]];});}
  function sec(t,a,empty){h+='<div class="sec-t">'+t+(a.length?'（'+a.length+'）':'')+'</div>';h+=a.length?listHTML('','',items(a)).replace(/^[\s\S]*?<ul class="list">/,'<ul class="list">'):'<p class="note">'+empty+'</p>';}
  var open=TODO.filter(function(it){return it[3]!=='done';});
  PEOPLE.forEach(function(p){sec(p,open.filter(function(it){return it[2]===p;}),'目前沒有待辦事項');});
  var rest=open.filter(function(it){return PEOPLE.indexOf(it[2])<0;});
  if(rest.length)sec('還沒分配',rest);
  sec('已完成',TODO.filter(function(it){return it[3]==='done';}),'');
  return h;
}

document.getElementById('strip').innerHTML=stripHTML();
var now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
var inTrip=today.getFullYear()===2026&&today.getMonth()===11&&today.getDate()>=11&&today.getDate()<=23;

function render(keep){
  var h=(location.hash||'#overview').slice(1),main=document.getElementById('main'),html;
  var idx=DAYS.findIndex(function(d){return d.id===h;});
  if(idx>=0)html=dayHTML(idx);
  else if(h==='prep')html=listHTML('行前準備','出發前一起檢查',PREP);
  else if(h==='budget')html=budgetHTML();
  else if(h==='todo')html=todoHTML();
  else{h='overview';html=overviewHTML();}
  main.innerHTML='<section class="page">'+html+'</section>';
  document.querySelectorAll('[data-p]').forEach(function(a){if(a.dataset.p===h)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  if(inTrip)document.querySelectorAll('[data-day="'+today.getDate()+'"]').forEach(function(a){a.classList.add('today');});
  var cur=document.querySelector('.strip [aria-current="page"]');if(cur&&keep!==true)cur.scrollIntoView({inline:'center',block:'nearest'});
  if(keep!==true)window.scrollTo(0,0);
  var cd=document.getElementById('cd');
  if(cd){var n=Math.round((new Date(2026,11,11)-today)/864e5);
    if(n>0)cd.innerHTML='距離出發還有<b class="num">'+n+'</b>天';
    else if(inTrip)cd.innerHTML='<b>旅行中</b><a href="#d'+today.getDate()+'">看今天的行程 ›</a>';
    else cd.textContent='謝謝大家，一起完成這趟旅行。';}
}
window.addEventListener('hashchange',function(){render();});render();
loadLive();
(async function(){
  try{
    if(!window.claude||!window.claude.use)return;
    var db=await window.claude.use('db'); if(!db)return;
    db.collection('weather').onSnapshot(function(snap){
      var n={}; snap.docs.forEach(function(d){if(d.exists){var v=d.data();if(v&&typeof v.hi==='number')n[d.id]=v;}});
      WX=n; var y=window.scrollY; render(true); window.scrollTo(0,y);
    },function(){});
  }catch(e){}
})();
</script>
